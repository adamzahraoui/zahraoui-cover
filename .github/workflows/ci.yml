name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24.18.0'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_ENV: test
      POSTGRES_DB: zahraoui_ci_test
      POSTGRES_USER: zahraoui_ci
      POSTGRES_PASSWORD: synthetic-ci-postgres
      DATABASE_URL: postgresql://zahraoui_ci:synthetic-ci-postgres@127.0.0.1:5432/zahraoui_ci_test
      TEST_DATABASE_URL: postgresql://zahraoui_ci:synthetic-ci-postgres@127.0.0.1:5432/zahraoui_ci_test
      PUBLIC_ORIGIN: http://127.0.0.1:3000
      SMTP_MODE: local
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      SMTP_FROM: ci@example.invalid
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24.18.0'
      - name: Generate disposable keys
        run: |
          for key in RATE_KEY_SECRET CSRF_SECRET RESET_JOB_KEY; do
            printf '%s=%s\n' "$key" "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          done
      - name: Start loopback services
        run: docker compose -p zahraoui-ci --profile mail up -d --wait --wait-timeout 60
      - run: npm ci
        working-directory: backend
      - run: npm run db:validate && npm run db:migrate && npm run db:status
        working-directory: backend
      - name: Check schema drift
        run: npx --no-install prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm run typecheck && npm run lint
        working-directory: backend
      - run: npm test && npm run test:integration
        working-directory: backend
      - name: Stop disposable services
        if: always()
        run: docker compose -p zahraoui-ci --profile mail down --volumes
