name: zahraoui-staging

x-logs: &logs
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-app-env: &app-env
  NODE_ENV: test
  STAGING_MODE: "true"
  HOST: 0.0.0.0
  PUBLIC_ORIGIN: http://127.0.0.1:${STAGING_PORT:-8088}
  FRONTEND_DIST_DIR: /app/frontend
  PUBLIC_INDEXING_ENABLED: "false"
  TRUST_PROXY_HOPS: "1"
  DATABASE_URL: postgresql://zc_stage_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}@postgres:5432/zc_stage
  RATE_KEY_SECRET: ${RATE_KEY_SECRET:?Set RATE_KEY_SECRET}
  CSRF_SECRET: ${CSRF_SECRET:?Set CSRF_SECRET}
  RESET_JOB_KEY: ${RESET_JOB_KEY:?Set RESET_JOB_KEY}
  IDEMPOTENCY_KEY_SECRET: ${IDEMPOTENCY_KEY_SECRET:?Set IDEMPOTENCY_KEY_SECRET}
  QUOTE_PDF_DIR: /private-documents
  SMTP_MODE: local
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_FROM: staging@example.invalid
  PRIVACY_NOTICE_VERSION: staging-synthetic
  QUOTE_NOTICE_TEXT: Données fictives uniquement pour tester les demandes de devis.
  CONTACT_NOTICE_TEXT: Données fictives uniquement pour tester les messages de contact.
  ASSISTANCE_NOTICE_TEXT: Données fictives uniquement pour tester les demandes d’assistance.
  CONTACT_ACK_EMAIL: "true"
  QUOTE_ACK_EMAIL: "true"
  RENEWAL_NOTIFY_EMAIL: renewals@example.invalid

x-app: &app
  image: zahraoui/staging-backend:local
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp:mode=1777]
  volumes:
    - documents:/private-documents
  restart: unless-stopped
  stop_grace_period: 25s
  mem_limit: 512m
  cpus: 1
  pids_limit: 96
  logging: *logs
  environment: *app-env

services:
  proxy:
    image: zahraoui/staging-proxy:local
    build:
      context: .
      target: proxy
    ports:
      - "127.0.0.1:${STAGING_PORT:-8088}:8080"
    networks: [entry, web]
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp:mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging: *logs
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/robots.txt]
      interval: 10s
      timeout: 4s
      retries: 4

  backend:
    <<: *app
    build:
      context: .
      target: backend
    networks: [web, data]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 5

  worker:
    <<: *app
    command: [node, dist/src/worker.js]
    networks: [data, mail]
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, worker-health.mjs]
      interval: 15s
      timeout: 6s
      retries: 4

  migrate:
    image: zahraoui/staging-migration:local
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: postgresql://zc_stage_owner:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/zc_stage
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp:mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    mem_limit: 512m
    cpus: 1
    pids_limit: 96
    logging: *logs

  postgres:
    image: zahraoui/staging-postgres:local
    build:
      context: .
      target: postgres
    user: postgres
    environment:
      POSTGRES_DB: zc_stage
      POSTGRES_USER: zc_stage_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    networks: [data]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/staging/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 128m
    mem_limit: 768m
    cpus: 1
    pids_limit: 96
    logging: *logs
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, zc_stage_owner, -d, zc_stage]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: zahraoui/staging-mailpit:local
    build:
      context: .
      target: mailpit
    user: "65532:65532"
    networks: [mail]
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_MAX_MESSAGES: "200"
    read_only: true
    tmpfs: [/tmp:mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging: *logs
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 10s
      timeout: 4s
      retries: 5

networks:
  entry:
  web:
    internal: true
  data:
    internal: true
  mail:
    internal: true

volumes:
  postgres_data:
  documents:
