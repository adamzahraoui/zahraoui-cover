map "$uri:$status" $asset_cache {
    default "";
    ~^/assets/.*:(200|206|304)$ "public, max-age=31536000, immutable";
}

log_format staging '$request_method $status $body_bytes_sent $request_time';

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    access_log /dev/stdout staging;

    client_max_body_size 4m;
    client_body_timeout 15s;
    send_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control $asset_cache always;

    # Resolve the backend again if Compose recreates it with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~* ^/api/health(?:/|$) { return 404; }

    location ^~ /assets/ {
        root /srv/frontend;
        try_files $uri =404;
    }

    location / {
        set $app http://backend:3000;
        proxy_pass $app;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_intercept_errors off;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Forwarded "";
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-Robots-Tag;
    }
}
